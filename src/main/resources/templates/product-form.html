<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ürün Ekle</title>
</head>
<body>
<h2>Yeni Ürün Ekle</h2>

<form th:action="@{/staff/products}" th:object="${productDto}" method="post">

    <label>Ürün Kodu</label>
    <input type="text" th:field="*{productCode}">
    <span th:errors="*{productCode}"></span>
    <br>

    <label>Ürün Adı</label>
    <input type="text" th:field="*{name}">
    <span th:errors="*{name}"></span>
    <br>

    <label>Birim</label>
    <input type="text" th:field="*{unit}" placeholder="kg, lt, adet">
    <span th:errors="*{unit}"></span>
    <br>

    <label>Miktar</label>
    <input type="number" th:field="*{quantity}">
    <span th:errors="*{quantity}"></span>
    <br>

    <label>Kritik Stok Seviyesi</label>
    <input type="number" th:field="*{criticalStockLevel}">
    <span th:errors="*{criticalStockLevel}"></span>
    <br>

    <label>Alış Fiyatı</label>
    <input type="number" step="0.01" th:field="*{purchasePrice}">
    <span th:errors="*{purchasePrice}"></span>
    <br>

    <label>Satış Fiyatı</label>
    <input type="number" step="0.01" th:field="*{salePrice}">
    <span th:errors="*{salePrice}"></span>
    <br>

    <label>Kategori</label>
    <select th:field="*{categoryId}">
        <option value="">Seçiniz</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}">
        </option>
    </select>
    <span th:errors="*{categoryId}"></span>
    <br>

    <label>Tedarikçi</label>
    <select th:field="*{supplierId}">
        <option value="">Seçiniz</option>
        <option th:each="supplier : ${suppliers}"
                th:value="${supplier.id}"
                th:text="${supplier.companyName}">
        </option>
    </select>
    <span th:errors="*{supplierId}"></span>
    <br>

    <button type="submit">Kaydet</button>
</form>

<a href="/staff/products">Geri Dön</a>
</body>
</html>
