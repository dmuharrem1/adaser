<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${productDto.id == null} ? 'Ürün Ekle' : 'Ürün Güncelle'">

        Ürün Formu

    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 min-h-screen">

<nav class="bg-slate-900 px-8 py-4 flex justify-between items-center">

    <strong class="text-white text-lg">

        Adaser Stok Takip

    </strong>

    <div class="flex gap-6 text-slate-300">

        <a href="/">Dashboard</a>

        <a class="text-white border-b-2 border-blue-400"
           href="/staff/products">

            Ürünler

        </a>

        <a href="/staff/movements">

            Stok Hareketleri

        </a>

        <a href="/staff/products/critical">

            Kritik Stoklar

        </a>

        <a href="/logout">

            Çıkış

        </a>

    </div>

</nav>

<main class="max-w-7xl mx-auto p-8">

    <div class="mb-8">

        <h1 class="text-3xl font-bold">

            Yeni Ürün Ekle

        </h1>

        <p class="text-slate-500 mt-2">

            Hazır ürün kartı seçerek formu otomatik doldurabilirsiniz.

        </p>

    </div>

    <section class="bg-white rounded-2xl shadow p-6 mb-8">

        <h2 class="font-bold text-xl mb-5">

            Hazır Ürün Şablonları

        </h2>

        <div class="grid grid-cols-4 gap-5">

            <button
                    type="button"
                    id="template-1"
                    onclick="selectProductTemplate(
'template-1',
'ADS-001',
'Fayans Seramik Yapıştırıcı Harcı',
'kg',
250,
50,
120,
180,
'fayans-seramik-yapistirici.jpg'
)"
                    class="template-card border rounded-2xl p-4 hover:shadow transition text-left">

                <img
                        src="/css/images/fayans-seramik-yapistirici.jpg"
                        class="h-40 w-full object-contain">

                <h3 class="font-semibold mt-4">

                    Fayans Seramik Yapıştırıcı Harcı

                </h3>

                <p class="text-sm text-slate-500">

                    Varsayılan stok 250

                </p>

            </button>


            <button
                    type="button"
                    id="template-2"
                    onclick="selectProductTemplate(
'template-2',
'ADS-002',
'Isı Yalıtım Levha Yapıştırıcısı',
'kg',
180,
40,
90,
140,
'isi-yalitim-levha-yapistiricisi.jpg'
)"
                    class="template-card border rounded-2xl p-4 hover:shadow transition text-left">

                <img
                        src="/css/images/isi-yalitim-levha-yapistiricisi.jpg"
                        class="h-40 w-full object-contain">

                <h3 class="font-semibold mt-4">

                    Isı Yalıtım Levha Yapıştırıcısı

                </h3>

                <p class="text-sm text-slate-500">

                    Varsayılan stok 180

                </p>

            </button>


            <button
                    type="button"
                    id="template-3"
                    onclick="selectProductTemplate(
'template-3',
'ADS-003',
'Isı Yalıtım Levha Sıvası',
'kg',
35,
50,
200,
320,
'isi-yalitim-levha-sivasi.jpg'
)"
                    class="template-card border rounded-2xl p-4 hover:shadow transition text-left">

                <img
                        src="/css/images/isi-yalitim-levha-sivasi.jpg"
                        class="h-40 w-full object-contain">

                <h3 class="font-semibold mt-4">

                    Isı Yalıtım Levha Sıvası

                </h3>

                <p class="text-sm text-slate-500">

                    Kritik takipli ürün

                </p>

            </button>


            <button
                    type="button"
                    id="template-4"
                    onclick="selectProductTemplate(
'template-4',
'ADS-004',
'Derz Dolgusu',
'kg',
90,
25,
150,
230,
'derz-dolgusu.jpg'
)"
                    class="template-card border rounded-2xl p-4 hover:shadow transition text-left">

                <img
                        src="/css/images/derz-dolgusu.jpg"
                        class="h-40 w-full object-contain">

                <h3 class="font-semibold mt-4">

                    Derz Dolgusu

                </h3>

                <p class="text-sm text-slate-500">

                    Varsayılan stok 90

                </p>

            </button>

        </div>

    </section>

    <section class="bg-white rounded-2xl shadow p-6">

        <form th:action="${productDto.id == null} ? '/staff/products' : '/staff/products/update/' + ${productDto.id}"
              th:object="${productDto}"
              method="post">
            <input
                    type="hidden"
                    th:field="*{imageName}">

            <div class="grid grid-cols-3 gap-5">

                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Ürün Kodu

                    </label>

                    <input
                            th:field="*{productCode}"
                            placeholder="Örn: ADS-001"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Ürün Adı

                    </label>

                    <input
                            th:field="*{name}"
                            placeholder="Ürün adı"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Birim

                    </label>

                    <input
                            th:field="*{unit}"
                            placeholder="kg, lt, adet"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Stok Miktarı

                    </label>

                    <input
                            type="number"
                            th:field="*{quantity}"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Kritik Stok Seviyesi

                    </label>

                    <input
                            type="number"
                            th:field="*{criticalStockLevel}"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Alış Fiyatı (₺)

                    </label>

                    <input
                            type="number"
                            step="0.01"
                            th:field="*{purchasePrice}"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Satış Fiyatı (₺)

                    </label>

                    <input
                            type="number"
                            step="0.01"
                            th:field="*{salePrice}"
                            class="border rounded-xl p-3 w-full">

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Kategori

                    </label>

                    <select
                            th:field="*{categoryId}"
                            class="border rounded-xl p-3 w-full">

                        <option value="">

                            Kategori seçiniz

                        </option>

                        <option
                                th:each="category:${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>

                    </select>

                </div>


                <div>

                    <label class="block mb-2 font-semibold text-slate-700">

                        Tedarikçi

                    </label>

                    <select
                            th:field="*{supplierId}"
                            class="border rounded-xl p-3 w-full">

                        <option value="">

                            Tedarikçi seçiniz

                        </option>

                        <option
                                th:each="supplier:${suppliers}"
                                th:value="${supplier.id}"
                                th:text="${supplier.companyName}">
                        </option>

                    </select>

                </div>

            </div>

            <div class="flex justify-end mt-8">

                <button
                        class="bg-blue-600 text-white px-8 py-3 rounded-xl">

                    Kaydet

                </button>

            </div>

        </form>

    </section>

</main>

<script>

    function selectProductTemplate(
        cardId,
        code,
        name,
        unit,
        quantity,
        criticalStock,
        purchasePrice,
        salePrice,
        imageName){

        document.getElementById("productCode").value=code;

        document.getElementById("name").value=name;

        document.getElementById("unit").value=unit;

        document.getElementById("quantity").value=quantity;

        document.getElementById("criticalStockLevel").value=criticalStock;

        document.getElementById("purchasePrice").value=purchasePrice;

        document.getElementById("salePrice").value=salePrice;

        document.getElementById("imageName").value=imageName;

        document.querySelectorAll(".template-card").forEach(card=>{

            card.classList.remove(
                "border-blue-500",
                "bg-blue-50"
            );

        });

        document.getElementById(cardId).classList.add(
            "border-blue-500",
            "bg-blue-50"
        );

    }

</script>

</body>

</html>
