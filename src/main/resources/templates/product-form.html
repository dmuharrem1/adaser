<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${productDto.id == null} ? 'Ürün Ekle' : 'Ürün Güncelle'">Ürün Formu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <strong>Adaser Stok Takip</strong>
    <div>
        <a href="/">Dashboard</a>
        <a href="/staff/products">Ürünler</a>
        <a href="/staff/movements">Stok Hareketleri</a>
        <a href="/staff/products/critical">Kritik Stoklar</a>
        <a href="/logout">Çıkış</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2 class="page-title"
            th:text="${productDto.id == null} ? 'Yeni Ürün Ekle' : 'Ürün Güncelle'">
            Ürün Formu
        </h2>

        <p class="page-description">
            Ürün kodu, stok miktarı, fiyat bilgileri, kategori ve tedarikçi alanlarını eksiksiz doldurunuz.
        </p>

        <form th:action="@{${productDto.id == null ? '/staff/products' : '/staff/products/update/' + productDto.id}}"
              th:object="${productDto}"
              method="post">

            <div class="form-grid">
                <div>
                    <label>Ürün Kodu</label>
                    <input type="text" th:field="*{productCode}" placeholder="Örn: ADS-001">
                    <span class="error" th:errors="*{productCode}"></span>
                </div>

                <div>
                    <label>Ürün Adı</label>
                    <input type="text" th:field="*{name}" placeholder="Örn: Seramik Yapıştırıcı">
                    <span class="error" th:errors="*{name}"></span>
                </div>

                <div>
                    <label>Birim</label>
                    <input type="text" th:field="*{unit}" placeholder="kg, lt, adet">
                    <span class="error" th:errors="*{unit}"></span>
                </div>

                <div>
                    <label>Miktar</label>
                    <input type="number" th:field="*{quantity}">
                    <span class="error" th:errors="*{quantity}"></span>
                </div>

                <div>
                    <label>Kritik Stok Seviyesi</label>
                    <input type="number" th:field="*{criticalStockLevel}">
                    <span class="error" th:errors="*{criticalStockLevel}"></span>
                </div>

                <div>
                    <label>Alış Fiyatı</label>
                    <input type="number" step="0.01" th:field="*{purchasePrice}">
                    <span class="error" th:errors="*{purchasePrice}"></span>
                </div>

                <div>
                    <label>Satış Fiyatı</label>
                    <input type="number" step="0.01" th:field="*{salePrice}">
                    <span class="error" th:errors="*{salePrice}"></span>
                </div>

                <div>
                    <label>Kategori</label>
                    <select th:field="*{categoryId}">
                        <option value="">Kategori seçiniz</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>
                    </select>
                    <span class="error" th:errors="*{categoryId}"></span>
                </div>

                <div>
                    <label>Tedarikçi</label>
                    <select th:field="*{supplierId}">
                        <option value="">Tedarikçi seçiniz</option>
                        <option th:each="supplier : ${suppliers}"
                                th:value="${supplier.id}"
                                th:text="${supplier.companyName}">
                        </option>
                    </select>
                    <span class="error" th:errors="*{supplierId}"></span>
                </div>
            </div>

            <button class="btn btn-success" type="submit"
                    th:text="${productDto.id == null} ? 'Ürünü Kaydet' : 'Ürünü Güncelle'">
                Kaydet
            </button>

            <a class="btn" href="/staff/products">Geri Dön</a>
        </form>
    </div>
</div>

</body>
</html>
