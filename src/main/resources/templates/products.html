<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ürün Yönetimi | Adaser Stok Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<nav class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex items-center justify-between shadow-sm">

    <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25 12 3 3 8.25m18 0-9 5.25m9-5.25v7.5L12 21m0-7.5L3 8.25m9 5.25V21M3 8.25v7.5L12 21" />
            </svg>
        </div>

        <div class="text-lg tracking-wide">
            <span class="text-white font-bold">Adaser</span>
            <span class="text-slate-300 font-light">Stok Takip</span>
        </div>
    </a>

    <div class="flex items-center gap-1 text-sm">
        <a href="/" class="flex items-center gap-2 px-3 py-2 text-slate-400 hover:text-white transition">Dashboard</a>
        <a href="/staff/products" class="flex items-center gap-2 px-3 py-2 text-white border-b-2 border-blue-400">Ürünler</a>
        <a href="/staff/movements" class="flex items-center gap-2 px-3 py-2 text-slate-400 hover:text-white transition">Stok Hareketleri</a>
        <a href="/staff/products/critical" class="flex items-center gap-2 px-3 py-2 text-slate-400 hover:text-white transition">Kritik Stoklar</a>
        <a href="/logout" class="ml-4 border-l border-slate-700 pl-4 text-slate-400 hover:text-red-400 transition">Çıkış</a>
    </div>

</nav>

<main class="max-w-7xl mx-auto px-6 py-8">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Ürün Yönetimi</h1>
        <p class="text-slate-500 mt-1">
            Ürünleri görüntüleyin, arayın, filtreleyin ve stok bilgilerini yönetin.
        </p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

        <div class="p-5 border-b border-slate-200 flex items-center justify-between gap-4">

            <div class="flex items-center gap-3 flex-1">

                <form action="/staff/products/search" method="get" class="relative w-80">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="1.8">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>

                    <input type="text"
                           name="keyword"
                           placeholder="Ürün ara..."
                           class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </form>

                <form action="/staff/products/filter" method="get">
                    <select name="category"
                            class="w-56 px-4 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Kategori seçiniz</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.name}"
                                th:text="${category.name}">
                        </option>
                    </select>
                </form>

            </div>

            <a href="/staff/products/new"
               class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-5 h-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Yeni Ürün Ekle
            </a>

        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-700">
                <tr>
                    <th class="px-5 py-3 text-left font-semibold">Kod</th>
                    <th class="px-5 py-3 text-left font-semibold">Ürün Adı</th>
                    <th class="px-5 py-3 text-left font-semibold">Birim</th>
                    <th class="px-5 py-3 text-left font-semibold">Miktar</th>
                    <th class="px-5 py-3 text-left font-semibold">Kritik Seviye</th>
                    <th class="px-5 py-3 text-left font-semibold">Satış Fiyatı</th>
                    <th class="px-5 py-3 text-left font-semibold">Kategori</th>
                    <th class="px-5 py-3 text-left font-semibold">Tedarikçi</th>
                    <th class="px-5 py-3 text-right font-semibold">İşlemler</th>
                </tr>
                </thead>

                <tbody class="divide-y divide-slate-100">
                <tr th:each="product : ${products}" class="hover:bg-slate-50 transition">

                    <td class="px-5 py-4 font-medium text-slate-700" th:text="${product.productCode}"></td>

                    <td class="px-5 py-4 text-slate-900 font-semibold" th:text="${product.name}"></td>

                    <td class="px-5 py-4 text-slate-600" th:text="${product.unit}"></td>

                    <td class="px-5 py-4">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-700" th:text="${product.quantity}"></span>

                            <span th:if="${product.quantity <= product.criticalStockLevel}"
                                  class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">
                                Kritik
                            </span>
                        </div>
                    </td>

                    <td class="px-5 py-4 text-slate-600" th:text="${product.criticalStockLevel}"></td>

                    <td class="px-5 py-4 text-slate-900 font-semibold">
                        <span th:text="${#numbers.formatDecimal(product.salePrice,1,'POINT',2,'COMMA')}"></span> ₺
                    </td>

                    <td class="px-5 py-4 text-slate-600" th:text="${product.category.name}"></td>

                    <td class="px-5 py-4 text-slate-600" th:text="${product.supplier.companyName}"></td>

                    <td class="px-5 py-4">
                        <div class="flex items-center justify-end gap-2">

                            <a th:href="@{/staff/products/edit/{id}(id=${product.id})}"
                               title="Düzenle"
                               class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="w-5 h-5"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="1.8">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Z" />
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M19.5 7.125 16.875 4.5" />
                                </svg>
                            </a>

                            <form th:action="@{/staff/products/delete/{id}(id=${product.id})}"
                                  method="post"
                                  onsubmit="return confirm('Bu ürünü silmek istediğinize emin misiniz?');">

                                <button type="submit"
                                        title="Sil"
                                        class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 hover:text-red-600 hover:bg-red-50 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         class="w-5 h-5"
                                         fill="none"
                                         viewBox="0 0 24 24"
                                         stroke="currentColor"
                                         stroke-width="1.8">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round"
                                              d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166M19.228 5.79 18.16 19.673A2.25 2.25 0 0 1 15.916 21H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0A48.108 48.108 0 0 0 16.5 5.5m-9 0A48.108 48.108 0 0 0 4.772 5.79m0 0A48.667 48.667 0 0 1 7.5 5.5m9 0v-.916A2.25 2.25 0 0 0 14.25 2.25h-4.5A2.25 2.25 0 0 0 7.5 4.584V5.5" />
                                    </svg>
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

    </div>

</main>

</body>
</html>
