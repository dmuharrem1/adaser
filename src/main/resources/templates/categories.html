<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kategoriler | Adaser Stok Takip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <strong>Adaser Stok Takip</strong>
    <div>
        <a href="/">Dashboard</a>
        <a href="/staff/products">Ürünler</a>
        <a href="/admin/suppliers">Tedarikçiler</a>
        <a href="/logout">Çıkış</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2 class="page-title">Kategori Yönetimi</h2>
        <p class="page-description">Ürünlerin bağlı olduğu yapı kimyasalı kategorilerini buradan yönetebilirsiniz.</p>

        <form th:action="@{/admin/categories}" th:object="${categoryDto}" method="post">
            <label>Kategori Adı</label>
            <input type="text" th:field="*{name}" placeholder="Örn: Yapıştırıcılar">
            <span class="error" th:errors="*{name}"></span>

            <button class="btn btn-success" type="submit">Kategori Ekle</button>
        </form>
    </div>

    <div class="card">
        <h3>Kategori Listesi</h3>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Kategori Adı</th>
                <th>İşlem</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}"></td>
                <td th:text="${category.name}"></td>
                <td>
                    <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
                          method="post"
                          onsubmit="return confirm('Bu kategoriyi silmek istediğinize emin misiniz?');">
                        <button class="btn btn-danger" type="submit">Sil</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
